server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

spring:
  application:
    name: mysend-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/mysend;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mysend:
  web-origins: ${WEB_ORIGINS:http://localhost:3000}
  app-base-url: ${APP_BASE_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}
  upload-directory: ${UPLOAD_DIRECTORY:./uploads}
  mail-from: ${MAIL_FROM:MySend <no-reply@example.com>}
  mail-delivery-enabled: ${MAIL_DELIVERY_ENABLED:false}
  development-code-enabled: ${DEVELOPMENT_CODE_ENABLED:false}
  storage-persistent: ${STORAGE_PERSISTENT:false}
  billing-enabled: ${BILLING_ENABLED:false}
  room-abuse:
    hash-key: ${ROOM_ABUSE_HASH_KEY:local-room-abuse-hash-key-change-me}
    create:
      window: ${ROOM_CREATE_RATE_WINDOW:1h}
      ip-limit: ${ROOM_CREATE_IP_LIMIT:40}
      actor-limit: ${ROOM_CREATE_ACTOR_LIMIT:8}
    enter:
      window: ${ROOM_ENTRY_RATE_WINDOW:10m}
      ip-limit: ${ROOM_ENTRY_IP_LIMIT:120}
      actor-limit: ${ROOM_ENTRY_ACTOR_LIMIT:30}
    upload:
      window: ${ROOM_UPLOAD_RATE_WINDOW:10m}
      ip-limit: ${ROOM_UPLOAD_IP_LIMIT:240}
      actor-limit: ${ROOM_UPLOAD_ACTOR_LIMIT:60}
  resend:
    api-key: ${RESEND_API_KEY:}
    base-url: ${RESEND_API_BASE_URL:https://api.resend.com}
    connect-timeout: ${RESEND_CONNECT_TIMEOUT:5s}
    read-timeout: ${RESEND_READ_TIMEOUT:10s}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    premium-price-id: ${STRIPE_PREMIUM_PRICE_ID:}
