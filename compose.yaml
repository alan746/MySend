services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mysend
      POSTGRES_USER: mysend
      POSTGRES_PASSWORD: local-mysend-password
    volumes:
      - mysend-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysend -d mysend"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/mysend
      DATABASE_USERNAME: mysend
      DATABASE_PASSWORD: local-mysend-password
      WEB_ORIGINS: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      UPLOAD_DIRECTORY: /app/uploads
      DEVELOPMENT_CODE_ENABLED: "true"
      MAIL_DELIVERY_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      - mysend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  mysend-postgres:
  mysend-uploads:
