name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run web checks
        run: npm run check

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run API tests
        run: mvn --batch-mode --no-transfer-progress verify

  web-container:
    name: Web container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build production image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.mysend.app
          --build-arg NEXT_PUBLIC_SITE_URL=https://mysend.app
          --build-arg NEXT_PUBLIC_BILLING_ENABLED=false
          --tag mysend-web:ci
          .

  api-container:
    name: API container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag mysend-api:ci backend
